[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iphonectl"
version = "0.1.0"
description = "Simple CLI for iOS device control - screenshots, apps, files, and more"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Marcus", email = "marcus.builds.things@gmail.com" }
]
keywords = ["ios", "iphone", "automation", "cli", "pymobiledevice3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "pymobiledevice3>=4.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
]

[project.scripts]
phonectl = "phonectl.cli:main"

[project.urls]
Homepage = "https://github.com/marcusbuildsthings-droid/phonectl"
Repository = "https://github.com/marcusbuildsthings-droid/phonectl"
Issues = "https://github.com/marcusbuildsthings-droid/phonectl/issues"

[tool.hatch.build.targets.wheel]
packages = ["phonectl"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
